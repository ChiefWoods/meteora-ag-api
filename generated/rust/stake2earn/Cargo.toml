[package]
name = "meteora-stake2earn-api-generated"
version = "0.1.1"
authors = ["OpenAPI Generator team and contributors"]
description = "Stake2Earn indexed read-only API for analytics, vault discovery, vault filtering, and vault detail responses."
license = ""
edition = "2021"

[dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
serde_repr = "^0.1"
url = "^2.5"
reqwest = { version = "^0.13", default-features = false, features = ["json", "multipart", "query", "form"] }

[features]
default = ["native-tls"]
native-tls = ["reqwest/native-tls"]
rustls = ["reqwest/rustls"]
