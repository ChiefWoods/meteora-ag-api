name: Publish npm package
run-name: Publish ${{ github.ref_name }}

on:
  push:
    tags:
      - "meteora-api-ts@v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract changelog
        run: |
          version="${GITHUB_REF_NAME#meteora-api-ts@v}"
          awk -v ver="$version" '
            $0 == "## " ver { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' packages/meteora-api/CHANGELOG.md | sed -e '/./,$!d' > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "No changelog entries found for ${version}" >&2
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node.js and npm registry
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish with npm trusted publishing
        run: npm publish
        working-directory: packages/meteora-api

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
