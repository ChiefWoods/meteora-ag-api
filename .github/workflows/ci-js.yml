name: JavaScript CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci-js.yml"
      - "bun.lock"
      - "clients/ts/**"
      - "generated/ts/**"
      - "lint-staged.config.ts"
      - "openapi/**"
      - "openapitools.json"
      - "oxfmt.config.ts"
      - "oxlint.config.ts"
      - "package.json"
      - "scripts/normalize-openapi.ts"
      - "tsconfig.json"
      - "tsdown.config.ts"
  pull_request:
    paths:
      - ".github/workflows/ci-js.yml"
      - "bun.lock"
      - "clients/ts/**"
      - "generated/ts/**"
      - "lint-staged.config.ts"
      - "openapi/**"
      - "openapitools.json"
      - "oxfmt.config.ts"
      - "oxlint.config.ts"
      - "package.json"
      - "scripts/normalize-openapi.ts"
      - "tsconfig.json"
      - "tsdown.config.ts"

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  check:
    name: Build, typecheck, lint, and format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint:check

      - name: Check formatting
        run: bun run format:check

      - name: Ensure generated files are committed
        run: |
          git status --short
          test -z "$(git status --porcelain)"
